name: 🐳 Publish Docker image for branch

on:
    push:
        branches:
            - main
            - develop
            - dev
            - feature/nestjs

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: write

jobs:
    build-ot-server:
        runs-on: ubuntu-latest
        if: github.repository == 'dream-num/univer'

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Generate Docker tags
              id: docker_meta
              run: |
                  # 替换分支名中的/为-以符合Docker标签格式
                  safe_branch=$(echo "${{ github.ref_name }}" | tr '/' '-')
                  echo "tags=ghcr.io/${{ github.repository }}/ot-server:$safe_branch" >> $GITHUB_OUTPUT

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./packages/univer-ot-wasm/src/server/Dockerfile
                  push: true
                  tags: ${{ steps.docker_meta.outputs.tags }}
                  cache-from: |
                      type=gha,scope=ot-server-${{ github.ref_name }}
                  cache-to: |
                      type=gha,mode=max,scope=ot-server-${{ github.ref_name }}
