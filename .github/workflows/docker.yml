name: 🐳 Publish Docker image for branch

on:
    push:
        branches:
            - main
            - develop
            - dev
            - ot
            - feature/cluster

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: write

jobs:
    build-ot-server:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Generate Docker tags
              id: docker_meta
              run: |
                  # 替换分支名中的/为-以符合Docker标签格式
                  safe_branch=$(echo "${{ github.ref_name }}" | tr '/' '-')
                  echo "tags=ghcr.io/${{ github.repository }}/ot-server:$safe_branch" >> $GITHUB_OUTPUT

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: packages/univer-ot-wasm
                  file: ./packages/univer-ot-wasm/Dockerfile
                  push: true
                  platforms: linux/amd64,linux/arm64/v8
                  tags: ${{ steps.docker_meta.outputs.tags }}
                  cache-from: |
                      type=gha,scope=ot-server-${{ github.ref_name }}
                  cache-to: |
                      type=gha,mode=max,scope=ot-server-${{ github.ref_name }}

    build-writebehind-worker:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Generate Docker tags
              id: docker_meta
              run: |
                  safe_branch=$(echo "${{ github.ref_name }}" | tr '/' '-')
                  echo "tags=ghcr.io/${{ github.repository }}/writebehind-worker:$safe_branch" >> $GITHUB_OUTPUT

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: packages/univer-ot-wasm
                  file: ./packages/univer-ot-wasm/Dockerfile.writebehind
                  push: true
                  platforms: linux/amd64,linux/arm64/v8
                  tags: ${{ steps.docker_meta.outputs.tags }}
                  cache-from: |
                      type=gha,scope=writebehind-worker-${{ github.ref_name }}
                  cache-to: |
                      type=gha,mode=max,scope=writebehind-worker-${{ github.ref_name }}

    build-ws-gateway:
        runs-on: ubuntu-latest
        env:
            GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
            PRIVATE_REGISTRY_TOKEN: ${{secrets.PRIVATE_REGISTRY_TOKEN}}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Generate Docker tags
              id: docker_meta
              run: |
                  safe_branch=$(echo "${{ github.ref_name }}" | tr '/' '-')
                  echo "tags=ghcr.io/${{ github.repository }}/ws-gateway:$safe_branch" >> $GITHUB_OUTPUT

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: packages/ws-gateway
                  file: ./packages/ws-gateway/Dockerfile
                  push: true
                  platforms: linux/amd64,linux/arm64/v8
                  tags: ${{ steps.docker_meta.outputs.tags }}
                  build-args: |
                      GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
                      PRIVATE_REGISTRY_TOKEN=${{ secrets.PRIVATE_REGISTRY_TOKEN }}
                  cache-from: |
                      type=gha,scope=ws-gateway-${{ github.ref_name }}
                  cache-to: |
                      type=gha,mode=max,scope=ws-gateway-${{ github.ref_name }}
