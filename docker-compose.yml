services:
    postgres:
        image: postgres:16
        ports:
            - 5432:5432
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: univer
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: always
    minio:
        image: quay.io/minio/minio:latest
        container_name: minio
        ports:
            - '9000:9000' # API 端口
            - '9001:9001' # Web 控制台端口
        environment:
            MINIO_ROOT_USER: minioadmin # 登录用户名 (至少 3 位)
            MINIO_ROOT_PASSWORD: minioadmin # 登录密码 (至少 8 位)
        volumes:
            - minio_data:/data # 数据持久化到本地 data 目录
        command: server --console-address ":9001" /data
        restart: always
    redis:
        image: redis:latest
        container_name: redis
        ports:
            - '6379:6379'
        restart: always
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes
    etcd:
        image: quay.io/coreos/etcd:v3.5.0
        container_name: etcd
        ports:
            - '2379:2379'
        restart: always
        volumes:
            - etcd_data:/data
        command: etcd --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://0.0.0.0:2379

volumes:
    postgres_data:
        driver: local
    minio_data:
        driver: local
    redis_data:
        driver: local
    etcd_data:
        driver: local
