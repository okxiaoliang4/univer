services:
    # PostgreSQL database
    postgres:
        image: postgres:16
        container_name: univer-postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: univer_ot
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
        networks:
            - univer-network
        healthcheck:
            test: [CMD-SHELL, pg_isready -U postgres]
            interval: 10s
            timeout: 5s
            retries: 5

    # MinIO (S3-compatible storage)
    minio:
        image: quay.io/minio/minio:latest
        container_name: univer-minio
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        volumes:
            - minio_data:/data
        command: server --console-address ":9001" /data
        restart: unless-stopped
        networks:
            - univer-network
        healthcheck:
            test: [CMD, curl, -f, 'http://localhost:9000/minio/health/live']
            interval: 30s
            timeout: 10s
            retries: 3

    # MinIO bucket initialization
    minio-init:
        image: minio/mc:latest
        container_name: univer-minio-init
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: /bin/sh
        command:
            - -c
            - |
                mc alias set myminio http://minio:9000 minioadmin minioadmin &&
                mc mb myminio/univer-ot --ignore-existing &&
                echo 'Bucket univer-ot created successfully'
        networks:
            - univer-network

    # Redis
    redis:
        image: redis:7-alpine
        container_name: univer-redis
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes
        restart: unless-stopped
        networks:
            - univer-network
        healthcheck:
            test: [CMD, redis-cli, ping]
            interval: 10s
            timeout: 5s
            retries: 5

    # etcd
    etcd:
        image: quay.io/coreos/etcd:v3.5.0
        container_name: univer-etcd
        volumes:
            - etcd_data:/data
        command: etcd --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://etcd:2379
        restart: unless-stopped
        networks:
            - univer-network
        healthcheck:
            test: [CMD, etcdctl, endpoint, health]
            interval: 30s
            timeout: 10s
            retries: 3

    # OT Server (HTTP API + gRPC only, no WebSocket)
    ot-server:
        build:
            context: packages/univer-ot-wasm
            dockerfile: Dockerfile
        container_name: univer-ot-server

        ports:
            - '3000:3000' # HTTP API server
            - '50051:50051' # gRPC server
        environment:
            # Database
            DATABASE_URL: postgresql://postgres:postgres@postgres:5432/univer_ot

            # Server ports
            SERVER_PORT: 3000
            GRPC_SERVER_PORT: 50051

            # Snapshot configuration
            SNAPSHOT_INTERVAL: 50

            # S3/MinIO configuration
            S3_ENDPOINT: http://minio:9000
            S3_REGION: us-east-1
            S3_BUCKET: univer-ot
            S3_ACCESS_KEY_ID: minioadmin
            S3_SECRET_ACCESS_KEY: minioadmin

            # Redis configuration
            REDIS_URL: redis://redis:6379

            # etcd configuration
            ETCD_ENDPOINTS: http://etcd:2379
            ETCD_LEASE_TTL_SECONDS: 30
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            etcd:
                condition: service_healthy
            minio:
                condition: service_healthy
            minio-init:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            - univer-network

    # WS Gateway (WebSocket connections + Redis Pub/Sub)
    ws-gateway:
        build:
            context: packages/ws-gateway
            dockerfile: Dockerfile
        container_name: univer-ws-gateway

        ports:
            - '8080:8080' # WebSocket server
            - '9464:9464' # Metrics endpoint
        environment:
            PORT: 8080
            METRICS_PORT: 9464
            REDIS_URL: redis://redis:6379
            ETCD_ENDPOINTS: http://etcd:2379
            USER_RPC_PREFIX: user.rpc
            DOCUMENT_RPC_PREFIX: document.rpc
            SKIP_TOKEN_VERIFICATION: 'false'
            SKIP_PERMISSION_CHECK: 'false'
            AWARENESS_TTL_SECONDS: 120
            PING_INTERVAL_MS: 15000
            PONG_TIMEOUT_MS: 10000
        depends_on:
            redis:
                condition: service_healthy
            etcd:
                condition: service_healthy
        restart: unless-stopped
        networks:
            - univer-network

networks:
    univer-network:
        driver: bridge

volumes:
    postgres_data:
        driver: local
    minio_data:
        driver: local
    redis_data:
        driver: local
    etcd_data:
        driver: local
