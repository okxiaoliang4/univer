[package]
name = "univer-ot-wasm"
version = "0.1.0"
edition = "2021"
description = "Rust WASM implementation of Univer Operational Transformation"
license = "Apache-2.0"
authors = [ "Univer Team" ]

[workspace]
members = [ "migration" ]

[lib]
crate-type = [ "cdylib" ]

[[bin]]
name = "ot-server"
path = "src/bin/ot-server.rs"
required-features = [ "server" ]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = "0.3"
log = { version = "0.4.29", optional = true }
console_log = { version = "1.0.0", optional = true }

# Server dependencies (only used for binary, not WASM)
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = [ "full" ], optional = true }
sea-orm = { version = "2.0.0-rc", features = [
    "runtime-tokio-native-tls",
    "sqlx-postgres",
    "macros"
], optional = true }
uuid = { version = "1.0", features = [
    "v4",
    "serde"
], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = [ "env-filter" ], optional = true }
anyhow = { version = "1.0", optional = true }
thiserror = { version = "1.0", optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = [ "cors" ], optional = true }
chrono = { version = "0.4", features = [ "serde" ], optional = true }
async-trait = { version = "0.1", optional = true }
dotenvy = { version = "0.15", optional = true }
migration = { path = "migration", optional = true }
socketioxide = { version = "0.18", optional = true }
aws-credential-types = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", optional = true, features = [ "behavior-version-latest" ] }
redis = { version = "0.25", features = [ "tokio-comp" ], optional = true }
md5 = { version = "0.7", optional = true }
etcd-client = { version = "0.14", optional = true }
tonic = { version = "0.11", optional = true }
prost = { version = "0.12", optional = true }
tokio-stream = { version = "0.1", optional = true }
local-ip-address = { version = "0.6", optional = true }

[dependencies.wee_alloc]
version = "0.4.5"
optional = true

[dependencies.console_error_panic_hook]
version = "0.1.6"
optional = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[features]
default = [ "console_error_panic_hook" ]
wasm-log = [
    "console_log",
    "dep:log"
]
server = [
    "axum",
    "tokio",
    "sea-orm",
    "uuid",
    "tracing",
    "tracing-subscriber",
    "anyhow",
    "thiserror",
    "tower",
    "tower-http",
    "chrono",
    "async-trait",
    "dotenvy",
    "migration",
    "socketioxide",
    "aws-credential-types",
    "aws-sdk-s3",
    "redis",
    "md5",
    "etcd-client",
    "tonic",
    "prost",
    "tokio-stream",
    "local-ip-address",
]

[build-dependencies]
tonic-build = "0.11"
