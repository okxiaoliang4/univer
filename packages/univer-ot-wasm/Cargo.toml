[workspace]
members = [
    "crates/ot-core",
    "crates/ot-common",
    "crates/ot-wasm",
    "crates/ot-server",
    "crates/writebehind-worker",
    "migration",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = [ "Univer Team" ]

[workspace.dependencies]
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
serde_repr = "0.1"
once_cell = "1.20"
