[package]
name = "ot-server"

version.workspace = true

edition.workspace = true

license.workspace = true

authors.workspace = true

description = "OT Server implementation"

[[bin]]
name = "ot-server"
path = "src/main.rs"

[dependencies]
ot-core = { path = "../ot-core" }
serde = { workspace = true }
serde_json = { workspace = true }
zstd = "0.13"

# Server dependencies (no feature flags needed!)
axum = "0.8"
tokio = { version = "1", features = [ "full" ] }
sea-orm = { version = "2.0.0-rc.30", features = [
    "runtime-tokio-native-tls",
    "sqlx-postgres",
    "macros"
] }
# sqlx for COPY operations (must match sea-orm's sqlx version)
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio"
] }
uuid = { version = "1.20", features = [
    "v4",
    "serde"
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [ "env-filter" ] }
anyhow = "1.0"
thiserror = "1.0"
tower = "0.4"
tower-http = { version = "0.5", features = [ "cors" ] }
chrono = { version = "0.4", features = [ "serde" ] }
async-trait = "0.1"
dotenvy = "0.15"
migration = { path = "../../migration" }
socketioxide = { version = "0.18", features = [
    "extensions",
    "state",
    "tracing"
] }
socketioxide-redis = { version = "0.4", features = [ "redis-cluster" ] }
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", features = [ "behavior-version-latest" ] }
redis = { version = "1", features = [
    "tokio-comp",
    "cluster",
    "connection-manager"
] }
md5 = "0.7"
etcd-client = "0.14"
tonic = "0.11"
tonic-reflection = "0.11"
prost = "0.12"
tokio-stream = "0.1"
local-ip-address = "0.6"
reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls"
] }
mimalloc = { version = "0.1.48", features = [ "v3" ] }
libmimalloc-sys = { version = "0.1.44", features = [ "extended" ] }
opentelemetry = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = [ "rt-tokio" ] }
opentelemetry-prometheus = "0.31.0"
prometheus = "0.14"
dashmap = "6.1"
futures = "0.3"
rand = "0.8"
jsonwebtoken = "9"
rslock = "0.7"

[dev-dependencies]
sysinfo = "0.34"
futures-util = "0.3"

[features]
default = []

[build-dependencies]
tonic-build = "0.11"
