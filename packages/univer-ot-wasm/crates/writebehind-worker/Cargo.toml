[package]
name = "writebehind-worker"

version.workspace = true

edition.workspace = true

license.workspace = true

authors.workspace = true

description = "Independent write-behind worker for OT operations"

[[bin]]
name = "writebehind-worker"
path = "src/main.rs"

[[example]]
name = "test_pubsub"
path = "examples/test_pubsub.rs"

[dependencies]
ot-common = { path = "../ot-common" }

# Async runtime
tokio = { version = "1", features = [ "full" ] }
futures = "0.3"

# Database
sea-orm = { version = "2.0.0-rc.30", features = [
    "runtime-tokio-native-tls",
    "sqlx-postgres"
] }

# Redis
redis = { version = "1", features = [
    "tokio-comp",
    "connection-manager"
] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [ "env-filter" ] }

# Error handling
anyhow = "1.0"

# Configuration
dotenvy = "0.15"

# Metrics
opentelemetry = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = [ "rt-tokio" ] }
opentelemetry-prometheus = "0.31.0"
prometheus = "0.14"

# HTTP server for health checks
axum = "0.8"

# Memory allocator
mimalloc = { version = "0.1.48", features = [ "v3" ] }

# Utilities
uuid = { version = "1.20", features = [
    "v4",
    "serde"
] }
chrono = { version = "0.4", features = [ "serde" ] }
once_cell = "1.21"
