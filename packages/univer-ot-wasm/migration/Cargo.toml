[package]
edition = "2021"
name = "migration"
publish = false
rust-version = "1.70.0"
version = "0.1.0"

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = [
    "macros",
    "rt",
    "rt-multi-thread"
] }

[dependencies.sea-orm-migration]
version = "~2.0.0-rc"
features = [
    "runtime-tokio-native-tls", # `ASYNC_RUNTIME` feature
    "sqlx-postgres", # `DATABASE_DRIVER` feature
]
