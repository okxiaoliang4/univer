syntax = "proto3";

package document;
option go_package = "./pbdocument";

enum DocType {
  UNKNOWN = 0; // 未知文档
  DOC = 1;     // DOC文档
  PDF = 2;     // PDF文档
  PPT = 3;     // 演示文稿
  XLS = 4;     // 电子表格
}

enum CreateType {
  CREATE_TYPE_UNKNOWN = 0;
  CREATE_TYPE_NEW = 1;
  CREATE_TYPE_FROM_FILE = 2;
}

enum UserSignatureType {
  USER_SIGNATURE_TYPE_UNKNOWN = 0;
  USER_SIGNATURE_TYPE_DRAW = 1;
  USER_SIGNATURE_TYPE_TEXT = 2;
  USER_SIGNATURE_TYPE_IMAGE = 3;
}

message Directory {
  string folder_id = 1; // 文件夹ID
  string name = 2;      // 文件夹名称
}

message UserInfo {
  string uid = 1;
  string name = 2;
  string email = 3;
  string nick_name = 4;
}

message UserSignatureInfo {
  string guid = 1;
  string user_id = 2;
  UserSignatureType type = 3;
  bytes data = 4;
}

message FolderInfo {
  string id = 1;                                  // 文件夹ID
  string user_id = 2;                             // 创建者用户ID
  string parent_id = 3;                           // 父级文件夹ID
  string name = 4;                                // 文件夹名称
  string icon = 5;                                // 文件夹图标
  repeated Directory path = 6;                    // 文件夹路径
  repeated KnowledgeBaseInfo knowledge_bases = 7; // 绑定知识库
  int64 create_time = 8;                          // 创建时间
  int64 last_open_time = 9;                       // 最后打开时间
  int64 last_edit_time = 10;                      // 最后编辑时间
  bool favorited = 11;                            // 是否已收藏
  int64 content_count = 12;                       // 文件数量
  int64 content_size = 13;                        // 文件大小
}

message Permissions {
  bool readable = 1;    // 是否可查阅
  bool commentable = 2; // 是否可评论
  bool writable = 3;    // 是否可编辑
  bool owner = 4;       // 是否所有者
}

message LimitedPermissions {
  bool readable = 1;    // 是否可查阅
  bool commentable = 2; // 是否可评论
  bool writable = 3;    // 是否可编辑
}

message DocumentInfo {
  string id = 1;                                  // 文档ID
  string title = 2;                               // 文档标题
  DocType type = 3;                               // 文档类型
  string note = 4;                                // 文档备注
  string creator = 5;                             // 文档创建者
  repeated KnowledgeBaseInfo knowledge_bases = 6; // 绑定知识库
  uint64 file_size = 7;                           // 文件大小
  int64 create_time = 8;        // 文档创建时间(unix时间戳，秒)
  int64 last_open_time = 9;     // 用户最后打开时间(unix时间戳，秒)
  int64 last_edit_time = 10;    // 用户最后编辑时间(unix时间戳，秒)
  Permissions permissions = 11; // 文档权限
  bool deleted = 12;            // 是否已删除
  string preview_url = 13;      // 文档预览图
  string link_permission = 14;  // 链接权限
  bool favorited = 15;          // 是否已收藏
  string status = 16;           // 文档状态
  FolderInfo folder = 17; // 文件夹信息
  string gpt_task_id = 18;    // gpt任务ID
  optional string sub_type = 19; // 文档子应用类型
  optional string gpt_task_id_v2 = 20; // gptv2任务ID
  optional string key = 21; // s3文档key
  bool used_quote = 22; // 是否使用引用功能
  optional UserInfo last_editor = 23; // 最后编辑者
  repeated DocumentInfo quote_docs = 24; // 引用文档
}

message ParticipantInfo {
  string user_id = 1;          // 用户ID
  Permissions permissions = 2; // 是否所有者
}

message FolderContentInfo {
  optional string folder_id = 1;                    // 文件夹ID
  string user_id = 2;                               // 用户ID
  string user_type = 3;                             // 用户类型
  string target_id = 4;                             // 目标ID
  string type = 5;                                  // 类型
  Permissions permissions = 6;                      // 权限
  int64 join_time = 7;                              // 加入时间
  int64 last_open_time = 8;                         // 最后打开时间
  int64 last_edit_time = 9;                         // 最后编辑时间
  optional DocumentInfo document = 10;              // 文档信息
  optional FolderInfo folder = 11;                  // 文件夹信息
  optional KnowledgeBaseInfo knowledge_base = 12;   // 知识库信息
  optional StaticDocumentInfo static_document = 13; // 静态文档信息
}

message FolderContentFilter {
  optional string creator_id = 1;               // 创建者ID
  repeated string type = 2;                     // 类型
  repeated string doc_status = 3;               // 文档状态
  repeated string target_ids = 4;               // 目标ID
  repeated DocType included_document_type = 5;  // 包含文档类型
  repeated DocType excluded_document_type = 6;  // 排除文档类型
  optional bool folder_included = 7;            // 筛选文件类型时是否包含文件夹
}

message DocumentFilter {
  bool created_by_me = 1;                       // 由我创建
  bool set_created_by_me = 2;                   // 已设置由我创建参数
  repeated DocType included_document_type = 3;  // 包含文档类型
  repeated DocType excluded_document_type = 4;  // 排除文档类型
}

message DocumentOrderBy {
  bool name_asc = 1;            // 文档名称升序
  bool name_desc = 2;           // 文档名称降序
  bool create_time_asc = 3;     // 创建时间升序
  bool create_time_desc = 4;    // 创建时间降序
  bool last_edit_time_asc = 5;  // 最后编辑时间升序
  bool last_edit_time_desc = 6; // 最后编辑时间降序
  bool last_open_time_asc = 7;  // 最后打开时间升序
  bool last_open_time_desc = 8; // 最后打开时间降序
}

message KnowledgeBaseInfo {
  string id = 1;            // 知识库ID
  string name = 2;          // 知识库名字
  string note = 3;          // 知识库备注
  string icon = 4;          // 知识库图标
  uint64 file_size = 5;     // 文件大小
  string creator = 6;       // 创建者
  int64 create_time = 7;    // 创建日期
  int64 last_open_time = 8; // 用户最后打开时间(unix时间戳，秒)
  int64 last_edit_time = 9; // 用户最后编辑时间(unix时间戳，秒)
  int64 content_count = 10; // 文件数量
  int64 content_size = 11;  // 文件大小
}

message DocumentEditor {
  string user_id = 1;       // 用户ID
  int64 last_edit_time = 2; // 最后编辑时间
}

// @deprecated
message DocumentVersionInfo {
  string id = 1;                       // 文档版本ID
  string name = 2;                     // 版本名称
  bool is_auto_name = 3;               // 是否自动创建
  repeated DocumentEditor users = 4;   // 参与用户列表
  uint64 file_size = 5;                // 文件大小
  DocumentVersionInfo revert_from = 6; // 还愿自版本
  string revert_from_id = 7;           // 还愿自版本ID
  int64 create_time = 8;               // 创建时间
  int64 update_clock = 9;              // 更新时钟
  int64 origin_clock = 10;             // 原始文档更新时钟
  bytes diff_update = 11;              // 差异更新数据
  bytes full_updates = 12;             // 完整更新数据
  optional string user_id = 13;         // 版本保存用户ID
}

message	DocumentMilestoneInfo {
  string id = 1;                                    // 文档版本ID
  string doc_id = 2;                                // 文档id
  string name = 3;                                  // 文档名称
  repeated DocumentEditor users = 4;                // 参与用户列表
  uint64 size = 5;                                  // 文件大小
  int32 created_at = 6;                             // 创建时间
  int32 updated_at = 7;                             // 更新时钟
  string storage_id = 8;                            // 文档版本s3 Id
  optional string restore_from_id = 9;              // 从哪个里程碑恢复的
  optional DocumentMilestoneInfo restore_from = 10; // 恢复的里程碑实体
}

message DocumentVersionInfoV2 {
  DocumentVersionSummary summary = 1;
  bytes updates = 2;
  int32 compression_type = 3;
}

message DocumentVersionSummary {
  string guid = 1;
  optional string user_id = 2;
  string name = 3;
  int64  size = 4;
  int64  clock = 5;
  int64  ts = 6;
  string note = 7;
  repeated DocumentEditor users = 8;
  int32 flag = 9;
}

message StaticDocumentInfo {
  string id = 1;                 // 文档ID
  string key = 2;                // S3 Object Key
  string title = 3;              // 文档标题
  string note = 4;               // 文档备注
  string owner = 5;              // 文档所有者
  uint64 file_size = 6;          // 文档大小
  string suffix = 7;             // 文档后缀
  string mime_type = 8;          // 文档MIME类型
  int64 create_time = 9;         // 文档创建时间(unix时间戳，秒)
  string preview_url = 10;       // 预览图URL
  string link_permission = 11;  // 链接权限
  string knowledge_base_id = 12; // 已绑定知识库ID
  int64 last_open_time = 13; // 用户最后打开时间(unix时间戳，秒)
  int64 last_edit_time = 14; // 用户最后编辑时间(unix时间戳，秒)
}

message FeatureSetting {
  string text = 1;
  string value = 2;
}

// ====================================================================================================================
// User Metadata
// ====================================================================================================================

message ListUserSignatureRequest {
  string user_id = 1; // 用户ID
}

message ListUserSignatureResponse {
  repeated UserSignatureInfo data = 1; // 签名列表
}

message CreateUserSignatureRequest {
  string user_id = 1; // 用户ID
  UserSignatureType type = 2;   // 签名类型
  bytes data = 3;    // 签名数据
}

message CreateUserSignatureResponse {
  UserSignatureInfo signature = 1; // 签名信息
}

message DeleteUserSignatureRequest {
  string guid = 1; // 签名ID
  string user_id = 2; // 用户ID
}

message DeleteUserSignatureResponse {}

// ====================================================================================================================
// Document
// ====================================================================================================================

message GetDocumentRequest {
  string document_id = 1;           // 文档ID
  optional string user_id = 2;      // 用户ID
  optional string access_token = 3; // 访问令牌
}

message GetDocumentResponse {
  DocumentInfo doc = 1; // 文档信息
}

message CreateDocumentRequest {
  string user_id = 1;                     // 用户ID
  DocType doc_type = 2;                   // 文档类型
  string title = 3;                       // 文档标题
  string note = 4;                        // 文档备注
  repeated string knowledge_base_ids = 5; // 知识库IDs(可选参数)
  string folder_id = 6;                   // 文件夹ID(可选参数)
  bytes sv = 7;                           // yjs state vector
  bytes update = 8;                       // yjs update
  string preview_url = 9;                 // 文档预览图
  string status = 10;                     // 文档状态
  string gpt_task_id = 11;                // GPT任务ID
  CreateType create_type = 12;            // 文档创建类型(New|FromFile)
  optional string gpt_task_id_v2 = 13;    // GPTv2任务ID
  optional string sub_type = 14;          // 文档子应用类型
  optional string guid = 15;              // 文档ID
  optional bool used_quote = 16;          // 是否使用引用功能
  optional string key = 17;                // Yjs文档s3文件名称
  optional string doc_key = 18;           // 文档key
  repeated string quote_doc_ids = 19;     // 引用文档ID
}

message CreateDocumentResponse {
  DocumentInfo doc = 1; // 文档信息
}

message ActivateDocumentRequest {
  string document_id = 1;     // 文档ID(guid)
  string user_id = 2;         // 用户ID
  optional string title = 3; // 文档标题
  optional bool used_quote = 4;   // 是否使用引用功能
}

message ActivateDocumentResponse {
  DocumentInfo doc = 1; // 文档信息
}

message CloneDocumentRequest {
  string user_id = 1;     // 用户ID
  string document_id = 2; // 文档ID
  string title = 3;       // 文档标题
  string folder_id = 4;   // 文件夹ID
  string version_id = 5;  // 版本ID
}

message CloneDocumentResponse {
  DocumentInfo doc = 1; // 文档信息
}

message BindKnowledgeBaseRequest {
  string user_id = 1;           // 用户ID
  string document_id = 2;       // 文档ID
  string knowledge_base_id = 3; // 知识库ID
}

message BindKnowledgeBaseResponse {
  DocumentInfo doc = 1; // 文档信息
}

message UnbindKnowledgeBaseRequest {
  string user_id = 1;           // 用户ID
  string document_id = 2;       // 文档ID
  string knowledge_base_id = 3; // 知识库ID
}

message UnbindKnowledgeBaseResponse {
  DocumentInfo doc = 1; // 文档信息
}

message ModifyDocumentNoteRequest {
  string user_id = 1;     // 用户ID
  string document_id = 2; // 文档ID
  string note = 3;        // 文档备注
}

message ModifyDocumentNoteResponse {
  DocumentInfo doc = 1; // 文档信息
}

message ModifyDocumentTitleRequest {
  string user_id = 1;     // 用户ID
  string document_id = 2; // 文档ID
  string title = 3;       // 文档标题
}

message ModifyDocumentTitleResponse {
  DocumentInfo doc = 1; // 文档信息
}

message ModifyDocumentUsedQuoteRequest {
  string user_id = 1;     // 用户ID
  string document_id = 2; // 文档ID
  bool used_quote = 3;    // 是否使用引用功能
}

message ModifyDocumentUsedQuoteResponse {
  DocumentInfo doc = 1; // 文档信息
}

message ModifyDocumentPreviewRequest {
  string user_id = 1;     // 用户ID
  string document_id = 2; // 文档ID
  string preview_url = 3; // 文档预览图
}

message ModifyDocumentPreviewResponse {
  DocumentInfo doc = 1; // 文档信息
}

message ModifyDocumentLinkPermissionRequest {
  string user_id = 1;                 // 用户ID
  string document_id = 2;             // 文档ID
  LimitedPermissions permissions = 3; // 用户权限
}

message ModifyDocumentLinkPermissionResponse {
  DocumentInfo doc = 1; // 文档信息
  StaticDocumentInfo static_doc = 2; // 静态文档信息
}

message InvitedUser {
  string email = 1;                   // 用户邮箱
  LimitedPermissions permissions = 2; // 用户权限
}

message InviteUserToDocumentRequest {
  string user_id = 1;             // 用户ID
  string document_id = 2;         // 文档ID
  string message = 3;             // 邀请消息内容
  repeated InvitedUser users = 4; // 邀请用户列表
}

message InviteUserToDocumentResponse {}

message AcceptDocumentInvitationRequest {
  string user_id = 1;     // 用户ID
  string document_id = 2; // 文档ID
}

message AcceptDocumentInvitationResponse {}

message QueryUserPermissionsRequest {
  string document_id = 1; // 文档ID
  optional string user_id = 2;     // 用户ID
  optional string access_token = 3; // 访问令牌
}

message QueryUserPermissionsResponse {
  Permissions permissions = 1; // 文档权限
  DocType doc_type = 2;
  map<int32, FeatureSetting> settings = 3;
}

message ModifyUserPermissionsRequest {
  string user_id = 1;        // 用户ID
  string document_id = 2;    // 文档ID
  string target_user_id = 3; // 目标用户ID
  bool readable = 4;         // 是否可查阅
  bool commentable = 5;      // 是否可评论
  bool writable = 6;         // 是否可编辑
}

message ModifyUserPermissionsResponse {
  LimitedPermissions permissions = 1; // 文档权限
}

message QueryDocumentParticipantsRequest {
  string document_id = 1;           // 文档ID
  optional string user_id = 2;      // 用户ID
  optional string access_token = 3; // 访问令牌
}

message QueryDocumentParticipantsResponse {
  repeated ParticipantInfo participants = 1;
}

// @deprecated
message ListDocumentVersionsRequest {
  string user_id = 1;             // 用户ID
  string document_id = 2;         // 文档ID
  int32 limit = 3;                // 返回数量限制
  int64 last_update_clock = 4;    // 最后更新时钟
  bool set_last_update_clock = 5; // 设置最后更新时钟
  bool include_diff_update = 6;   // 包含差异更新数据
  string sort = 7;                // 排序方式(枚举值: asc|desc)
}

message ListDocumentVersionsResponse {
  int64 current_update_clock = 1;        // 当前更新时钟
  repeated DocumentVersionInfo data = 2; // 版本列表
}

message ListDocumentMilestonesRequest {
  string document_id = 1;           // 文档ID
  optional string user_id = 2;      // 用户ID
  optional string access_token = 3; // 访问令牌
  optional int32 limit = 4;         // 返回数量限制
  optional string cursor = 5;       // 最后更新时钟
  string sort = 6;                  // 排序方式(枚举值: asc|desc)
}

message ListDocumentMilestonesResponse {
  optional string next_cursor = 1;        // 当前更新时钟
  repeated DocumentMilestoneInfo data = 2; // 版本列表
}

message RestoreDocumentMilestoneRequest {
  string user_id = 1;     // 用户ID
  string document_id = 2; // 文档ID
  string milestone_id = 3; // 版本ID
}

message RestoreDocumentMilestoneResponse {}

message GetDocumentVersionUpdateRequest {
  string user_id = 1;     // 用户ID
  string document_id = 2; // 文档ID
  string version_id = 3;  // 版本ID
}

message GetDocumentVersionUpdateResponse { bytes update = 1; }

// @deprecated
message ModifyDocumentVersionNameRequest {
  string user_id = 1;     // 用户ID
  string document_id = 2; // 文档ID
  string version_id = 3;  // 版本ID
  string name = 4;        // 版本名称
}

message ModifyDocumentVersionNameResponse {
  DocumentVersionInfo version = 1; // 版本信息
}

message GetDocumentVersionRequestV2 {
  string document_id = 1;           // 文档ID
  string version_guid = 2;          // 版本ID
  optional string user_id = 3;      // 用户ID
  optional string access_token = 4; // 访问令牌
}

message GetDocumentVersionResponseV2 {
  DocumentVersionInfoV2 version = 1; // 版本信息
}

message ListDocumentVersionsRequestV2 {
  string document_id = 1;           // 文档ID
  optional string user_id = 2;      // 用户ID
  optional string access_token = 3; // 访问令牌
  int32 limit = 4;                  // 返回数量限制
  int64 last_clock = 5;             // 最后更新时钟
  bool desc = 6;                    // 是否降序 
}

message ListDocumentVersionsResponseV2 {
  repeated DocumentVersionSummary data = 1; // 版本列表
}

message ModifyDocumentVersionNameRequestV2 {
  string user_id = 1;     // 用户ID
  string document_id = 2; // 文档ID
  string version_guid = 3;  // 版本ID
  string name = 4;        // 版本名称
}

message ModifyDocumentVersionNameResponseV2 {
  DocumentVersionSummary version = 1; // 版本信息
}

message SaveDocCurrentVersionRequestV2 {
  string user_id = 1;     // 用户ID
  string document_id = 2; // 文档ID
  optional string name = 3;        // 版本名称
}

message SaveDocCurrentVersionResponseV2 {
  DocumentVersionSummary version = 1; // 版本信息
}

message ModifyDocumentQuoteDocsRequest {
  optional string user_id = 1;       // 用户ID
  string document_id = 2;            // 文档ID
  repeated string quote_doc_ids = 3; // 引用文档ID列表
  bool coverage = 4;                 // 是否覆盖旧引用文档
}

message ModifyDocumentQuoteDocsResponse {}

message DeleteDocumentVersionRequest {
  string user_id = 1;     // 用户ID
  string document_id = 2; // 文档ID
  string version_id = 3;  // 版本ID
}

message DeleteDocumentVersionResponse {}

message DeleteDocumentRequest {
  string user_id = 1;     // 用户ID
  string document_id = 2; // 文档ID
}

message DeleteDocumentResponse {}

message QueryDocumentsByIdsRequest { repeated string ids = 1; }

message QueryDocumentsByIdsResponse { repeated DocumentInfo data = 1; }

message QueryRecentlyDocumentsRequest {
  string user_id = 1; // 用户ID
  DocType type = 2;   // 文档类型
  int32 page = 3;     // 页码
  int32 size = 4;     // 每页数量
}

message QueryRecentlyDocumentsResponse { repeated DocumentInfo data = 1; }

message QueryUserDocumentsRequest {
  string user_id = 1; // 用户ID
  repeated string statuses = 2; // 文档状态
}

message QueryUserDocumentsResponse { 
  repeated DocumentInfo docs = 1; 
}

message QueryUsedSpaceRequest {
  string user_id = 1; // 用户ID
}

message QueryUsedSpaceResponse {
  uint64 used_space = 1; // 已使用空间
  uint64 total_space = 2; // 总空间
  uint64 doc_count = 3; // 文档数量
}

enum PermissionRequestStatus {
  PR_STATUS_UNKNOWN = 0;
  PR_STATUS_PENDING = 1;
  PR_STATUS_DENY = 2;
  PR_STATUS_APPROVED = 3;
}

message RequestPermission {
  string document_id = 1;             // 文档ID
  string target_user_id = 2;          // 目标用户ID
  LimitedPermissions permissions = 3; // 用户权限
  PermissionRequestStatus status = 4; // 请求状态
  int64 create_time = 5;              // 创建时间
}

message RequestPermissionRequest {
  string user_id = 1;                 // 用户ID
  string document_id = 2;             // 文档ID
  LimitedPermissions permissions = 3; // 用户权限
}

message RequestPermissionResponse {
  string status = 1; // 请求状态(枚举值: pending|approved)
}

message ListPermissionRequestsRequest {
  string document_id = 1;           // 文档ID
  optional string user_id = 2;      // 用户ID
  optional string access_token = 3; // 访问令牌
}

message ListPermissionRequestsResponse { repeated RequestPermission data = 1; }

message UpdatePermissionRequestStatusRequest {
  string user_id = 1;                 // 用户ID
  string document_id = 2;             // 文档ID
  string target_user_id = 3;          // 目标用户ID
  PermissionRequestStatus status = 4; // 请求状态
}

message UpdatePermissionRequestStatusResponse {}

message GetFolderRequest {
  string user_id = 1;   // 用户ID
  string folder_id = 2; // 文件夹ID(为空返回根目录)
}

message GetFolderResponse {
  FolderInfo folder = 1; // 文件夹信息
}

message ListFolderRequest {
  string user_id = 1;           // 用户ID
  string parent_id = 2;         // 父级文件夹ID(可选)
  DocumentOrderBy order_by = 3; // 文件夹排序方式
}

message ListFolderResponse {
  repeated FolderInfo data = 1; // 文件夹列表
}

message CreateFolderRequest {
  string user_id = 1;   // 用户ID
  string name = 2;      // 文件夹名称
  string icon = 3;      // 文件夹图标(可选)
  string parent_id = 4; // 父级文件夹ID(可选)
}

message CreateFolderResponse {
  FolderInfo folder = 1; // 文件夹信息
}

message MoveFolderRequest {
  string user_id = 1;          // 用户ID
  string folder_id = 2;        // 文件夹ID
  string target_folder_id = 3; // 目标文件夹ID(为空表示根目录)
}

message MoveFolderResponse {
  FolderInfo folder = 1; // 文件夹信息
}

message MoveDocumentRequest {
  string user_id = 1;          // 用户ID
  string document_id = 2;      // 文档ID
  string target_folder_id = 3; // 目标文件夹ID(为空表示根目录)
}

message MoveDocumentResponse {}

message ModifyFolderNameRequest {
  string user_id = 1;   // 用户ID
  string folder_id = 2; // 文件夹ID
