// ====================================================================================================================
// AI Tool
// ====================================================================================================================

message CostCredit {
  string credit = 1;
  string display = 2;
}

message CostCreditWord {
  double cost = 1;
}

enum ScanHistoryType {
  AI_UNKNOWN = 0;
  AI_DETECT = 1;   // 去AI化
  AI_HUMANIZE = 2; // AI检测
  AI_DETECT_V2 = 3; // v2
  AI_PROFESSOR_REVIEW = 4; // 评分报告
}

message CreateTaskResult {
  string status = 1;  // 状态(枚举值: queued|rejected)
  string task_id = 2; // 任务ID
}

message ScanHistoryItem {
  string id = 1;
  ScanHistoryType type = 2;
  string user_id = 3;
  string doc_id = 4;
  bytes inputs = 5;
  bytes outputs = 6;
  int64 elapsed_msec = 7;
  int64 create_time = 8;
  optional string public_res_url = 9;
}

message AiEmptyRequest {}

message AiDetectRequest {
  string user_id = 1;
  string doc_id = 2;
  repeated string texts = 3;
  string version = 4;
}

message AiHumanizeRequest {
  string user_id = 1;
  string doc_id = 2;
  string mode = 3;
  repeated string texts = 4;
}

message DocumentTask {
  string task_id = 1;
  string task_type = 2;
  string task_status = 3;
}

message GetTaskQueueRequest {
  string user_id = 1;
  string doc_id = 2;
  string task_type = 3;
}

message GetTaskQueueResponse { repeated DocumentTask data = 1; }

message GetTaskStatusRequest {
  string user_id = 1;
  string task_id = 2;
}

message GetTaskStatusResponse {
  string status = 1;          // 任务状态
  string last_error = 2;      // 最后错误
  int64 last_failed_at = 3;   // 最后失败时间
  int64 next_process_at = 4;  // 下次处理时间
  ScanHistoryItem result = 5; // 任务结果
}

message StoreScanHistoryRequest { ScanHistoryItem item = 1; }

message StoreScanHistoryResponse {}

message UpdateScanHistoryPublicResUrlRequest {
  string scan_history_id = 1;
  string public_res_url = 2;
  string user_id = 3;
}

message UpdateScanHistoryPublicResUrlResponse {}

message QueryScanHistoryRequest {
  string user_id = 1;
  int32 page = 2;
  int32 size = 3;
  optional ScanHistoryType type = 4;
}

message QueryScanHistoryResponse {
  int32 total = 1;
  repeated ScanHistoryItem data = 2;
}

message QueryScanHistoryItemRequest {
  string id = 1;
  string user_id = 2;
}

message QueryScanHistoryItemResponse { ScanHistoryItem data = 1; }

message GetDocumentSnapshotRequest {
  string user_id = 1;
  string scan_history_id = 2;
}

message GetDocumentSnapshotResponse { 
  bytes update = 1; 
  int32 compression_type = 2;
  string doc_id = 3;
  optional string version_id = 4;
}

message DeleteScanHistoryItemRequest {
  string id = 1;
  string user_id = 2;
}

message DeleteScanHistoryItemResponse {}

// ====================================================================================================================
// gRPC Services
// ====================================================================================================================

service AiTool {
  rpc AiDetect(AiDetectRequest) returns (CreateTaskResult);
  rpc AiHumanize(AiHumanizeRequest) returns (CreateTaskResult);
  rpc AiDetectCredit(AiDetectRequest) returns (CostCredit);
  rpc AiHumanizeCredit(AiHumanizeRequest) returns (CostCredit);
  rpc AiDetectCost(AiEmptyRequest) returns (CostCreditWord);
  rpc AiHumanizeCost(AiEmptyRequest) returns (CostCreditWord);
  rpc GetTaskQueue(GetTaskQueueRequest) returns (GetTaskQueueResponse);
  rpc GetTaskStatus(GetTaskStatusRequest) returns (GetTaskStatusResponse);
  rpc StoreScanHistory(StoreScanHistoryRequest)
      returns (StoreScanHistoryResponse);
  rpc UpdateScanHistoryPublicResUrl(UpdateScanHistoryPublicResUrlRequest)
      returns (UpdateScanHistoryPublicResUrlResponse);
  rpc QueryScanHistory(QueryScanHistoryRequest)
      returns (QueryScanHistoryResponse);
  rpc QueryScanHistoryItem(QueryScanHistoryItemRequest)
      returns (QueryScanHistoryItemResponse);
  rpc GetDocumentSnapshot(GetDocumentSnapshotRequest)
      returns (GetDocumentSnapshotResponse);
  rpc DeleteScanHistoryItem(DeleteScanHistoryItemRequest)
      returns (DeleteScanHistoryItemResponse);
}

service UserMetadata {
  rpc CreateUserSignature(CreateUserSignatureRequest)
      returns (CreateUserSignatureResponse);
  rpc DeleteUserSignature(DeleteUserSignatureRequest)
      returns (DeleteUserSignatureResponse);
  rpc ListUserSignature(ListUserSignatureRequest)
      returns (ListUserSignatureResponse);
}

service Folder {
  rpc GetFolder(GetFolderRequest) returns (GetFolderResponse);
  rpc ListFolder(ListFolderRequest) returns (ListFolderResponse);
  rpc CreateFolder(CreateFolderRequest) returns (CreateFolderResponse);
  rpc MoveFolder(MoveFolderRequest) returns (MoveFolderResponse);
  rpc MoveDocument(MoveDocumentRequest) returns (MoveDocumentResponse);
  rpc ModifyFolderName(ModifyFolderNameRequest) returns (ModifyFolderNameResponse);
  rpc ListFolderDocuments(ListFolderDocumentsRequest) returns (ListFolderDocumentsResponse);
  rpc ListFolderContents(ListFolderContentsRequest) returns (ListFolderContentsResponse);
  rpc BindFolderToKnowledgeBase(BindFolderToKnowledgeBaseRequest) returns (BindFolderToKnowledgeBaseResponse);
  rpc UnbindFolderFromKnowledgeBase(UnbindFolderFromKnowledgeBaseRequest) returns (UnbindFolderFromKnowledgeBaseResponse);
  rpc DeleteFolder(DeleteFolderRequest) returns (DeleteFolderResponse);
}

service Document {
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
  rpc CloneDocument(CloneDocumentRequest) returns (CloneDocumentResponse);
  rpc CreateDocument(CreateDocumentRequest) returns (CreateDocumentResponse);
  rpc InterCreateDocument(InterCreateDocumentRequest) returns (InterCreateDocumentResponse);
  rpc InterDeleteDocument(InterDeleteDocumentRequest) returns (InterDeleteDocumentResponse);
  rpc InterSetDocumentStatus(InterSetDocumentStatusRequest) returns (InterSetDocumentStatusResponse);
  rpc InterClearUserData(InterClearUserDataRequest) returns (InterClearUserDataResponse);
  rpc ActivateDocument(ActivateDocumentRequest) returns (ActivateDocumentResponse);
  rpc BindKnowledgeBase(BindKnowledgeBaseRequest)
      returns (BindKnowledgeBaseResponse);
  rpc UnbindKnowledgeBase(UnbindKnowledgeBaseRequest)
      returns (UnbindKnowledgeBaseResponse);
