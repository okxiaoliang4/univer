syntax = "proto3";

package ot_rpc;

service OTRpcService {
  rpc BroadcastOp (BroadcastOpRequest) returns (BroadcastOpResponse);
}

message MutationInfo {
  string id = 1;
  string params = 2; // JSON string
  string op_id = 3;
}

message BroadcastOpRequest {
  string doc_id = 1;
  int64 base_rev = 2;
  string user_id = 4;
  string client_id = 5;
  repeated MutationInfo mutations = 6;
}

message BroadcastOpResponse {
  bool success = 1;
  int64 server_rev = 2;
  string error = 3;
}
